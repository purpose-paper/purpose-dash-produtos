function mcBaseMeses(d) {
  let ini, fim;
  if (d.giro === 'custom' && d.giro_ini && d.giro_fim) { ini = d.giro_ini <= d.giro_fim ? d.giro_ini : d.giro_fim; fim = d.giro_ini <= d.giro_fim ? d.giro_fim : d.giro_ini; }
  else { const t = d.giro === 'custom' ? 12 : (+d.giro || 12); fim = mcAddMes(mcMesAtual, -1); ini = mcAddMes(mcMesAtual, -t); }
  const r = []; for (let k = ini; k <= fim && r.length < 60; k = mcAddMes(k, 1)) r.push(k);
  return r;
}
function mcCalc(d, cenKey) {
  const R = {}, T = MC_TIPOS[d.tipo] || MC_TIPOS.importacao;
  const refs = (d.lancamento ? d.similares : d.skus).map(s => MC.info.get(s)).filter(x => x && x.nome !== 'SKU não encontrado');
  R.refs = refs;
  const Q = Math.max(0, Math.round(n(d.quantidade) || 0)); R.Q = Q;
  R.fator = d.lancamento ? (n(d.fator_lanc) ?? 1) : 1;
  R.meses = mcBaseMeses(d); R.nMeses = R.meses.length;

  const div = d.lancamento ? Math.max(refs.length, 1) : 1;
  R.serie = R.meses.map(m => { let q = 0, fl = 0;
    maps.forEach(mp => { const x = mp.get(m); if (x) { q += +x.q || 0; fl += +x.fl || 0; } });
    return {mes:m, q:q / div, fl:fl / div}; });
  R.vendasBase = sum(R.serie, 'q'); R.flBase = sum(R.serie, 'fl');
  R.mediaCalc = R.nMeses ? R.vendasBase / R.nMeses * R.fator : 0;
  R.media = n(d.media_manual) ?? R.mediaCalc;

  const media = k => { const v = refs.map(r => n(r[k])).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  R.precoCapa = d.lancamento ? n(d.preco_capa_lanc) : media('preco_capa');
  R.custoRef = media('custo_atual');
  R.preco = d.preco_venda_tipo === 'capa' ? R.precoCapa : d.preco_venda_tipo === 'manual' ? n(d.preco_medio_manual) : R.precoMedio;
  R.descCapa = R.precoCapa && R.preco ? 1 - R.preco / R.precoCapa : null;
  const qs = R.serie.map(s => s.q).sort((a, b) => a - b);
  R.mediana = qs.length ? qs[Math.floor(qs.length / 2)] : 0;
  R.serie.forEach(s => s.pico = R.mediana > 0 && s.q >= 1.5 * R.mediana);
  R.picos = R.serie.filter(s => s.pico);
  R.cenPct = n(d.cen && d.cen[cenKey]) || 0;
  R.usaSaz = !!d.sazonal && R.nMeses >= 12;
  R.saz = {};
  if (R.usaSaz) { const g = {}; R.serie.forEach(s => { const mo = s.mes.slice(5,7); (g[mo] = g[mo] || []).push(s.q); });
    Object.entries(g).forEach(([mo, v]) => R.saz[mo] = v.reduce((a, b) => a + b, 0) / v.length * R.fator); }
  R.picoMes = new Set(R.picos.map(s => s.mes.slice(5,7)));
  const escala = R.mediaCalc > 0 ? R.media / R.mediaCalc : 1;
  R.camp = {}; (d.campanhas || []).forEach(c => { if (c.mes) R.camp[c.mes] = (R.camp[c.mes] || 1) * (1 + (n(c.extra) ?? .5)); });
  R.demMes = k => { const mo = k.slice(5,7);
    const b = R.usaSaz && R.saz[mo] !== undefined && R.mediaCalc > 0 ? R.saz[mo] * escala : R.media;
    return Math.max(0, b * (1 + R.cenPct) * (R.camp[k] || 1)); };
  R.vendaMes = R.media * (1 + R.cenPct);

  // prazos
  R.prod = n(d.d_producao) ?? T.prazos[0]; R.trans = n(d.d_transito) ?? T.prazos[1];
  R.desemb = d.tipo === 'importacao' ? (n(d.d_desembaraco) ?? T.prazos[2]) : 0;
  const ped = d.data_pedido || hoje; R.pedido = ped;
  let fim = addDays(ped, R.prod); R.parados = 0; R.impactos = [];

  R.prazoTotal = diffDays(ped, R.chegada) - 1;

  // custo por unidade

    R.cambio = n(d.cambio) ?? R.cotacao;

    valor:R.baseProd * (n(p.pct) || 0), conta:`${fPct((n(p.pct) || 0) * 100, 0)} × ${fBRL(R.baseProd)} (${R.imp ? 'FOB do pedido' : 'produto'}) · ${MC_BASE[p.base] || ''}${n(p.dias) ? ' + ' + fInt(p.dias) + ' dias' : ''}`}));
  if (R.imp) {
    const fr = (n(d.frete_usd) || 0) * (R.cambio || 0);
    if (fr) R.pagtos.push({rot:'Frete internacional', data:R.fimProd, valor:fr, conta:`US$ ${fN(d.frete_usd, 2)} × R$ ${fN(R.cambio, 4)} · no embarque (fim da produção)`, auto:true});
    const u = R.u, imp = (u.ii + u.ipi + u.pis + u.cofins + u.icms + u.afrmm) * Q, desp = n(d.despesas_brl) || 0, sis = Q ? R.siscomex : 0;
    if (imp + desp + sis > 0) R.pagtos.push({rot:d.impostos === 'livro' ? 'Despesas de chegada (sem impostos: livro)' : 'Impostos e despesas de chegada', data:R.chegada, valor:imp + desp + sis,

  } else {

    if (dem <= 0) return;

    if (old > 0 && dem >= old && R.oldEnd === null) R.oldEnd = dataEm(k, d0 + (daily > 0 ? old / daily : 0));
    old -= s1; let rem = dem - s1, s2 = 0;

      if (Q > 0 && ps > 0 && rem >= ps && R.pedEnd === null) R.pedEnd = dataEm(k, d0 + (daily > 0 ? (s1 + ps) / daily : 0));

  };
  R.rows = [];
  for (let i = 0; i < 30; i++) {
    const k = mcAddMes(mcMesAtual, i), dm = mcDiasMes(k), d0 = i === 0 ? +hoje.slice(8,10) : 1, daily = R.demMes(k) / dm;
    const row = {mes:k, dem:daily * (dm - d0 + 1), chega:0, vend:0, vendPed:0, falta:0, est:0, sai:pagM[k] || 0, entra:0, saldo:0};
    if (!chegou && (jaChegou ? i === 0 : k === kCheg)) {
      const a = jaChegou ? d0 : +R.chegada.slice(8,10), antes = daily * Math.max(0, a - d0);

  R.proxPedido = R.pedEnd ? addDays(R.pedEnd.slice(0,7) + '-15', -R.prazoTotal - Math.round(R.seg * 30.4)) : null;
  const demEntre = (a, b) => { let t = 0;
    for (let k = a.slice(0,7); k <= b.slice(0,7); k = mcAddMes(k, 1)) { const dm = mcDiasMes(k);
      const ini = k === a.slice(0,7) ? +a.slice(8,10) : 1, fimD = k === b.slice(0,7) ? +b.slice(8,10) - 1 : dm;
      if (fimD >= ini) t += R.demMes(k) / dm * (fimD - ini + 1); }
    return t; };
  R.fimN = addDays(R.chegada, Math.round(R.cob * 30.4));
  R.demN = demEntre(R.chegada, R.fimN);

  const iFim = R.pedEnd ? R.rows.findIndex(r => r.mes === R.pedEnd.slice(0,7)) : -1, iCheg = R.rows.findIndex(r => r.mes === kCheg);

}
function mcDivisao(d, R) {
  const mesesAte = Math.max(0, (diffDays(hoje, R.chegada) - 1) / 30.4);
  const it = d.skus.map(s => MC.info.get(s)).filter(x => x && x.nome !== 'SKU não encontrado').map(x => {
    const mp = new Map((x.meses || []).map(m => [m.mes, m]));
    const qb = R.meses.reduce((t, m) => t + (+(mp.get(m) || {}).q || 0), 0);
    const v = R.nMeses ? qb / R.nMeses * (1 + R.cenPct) : 0, e = Math.max(0, +x.estoque_site || 0);
    return {sku:x.sku, nome:x.nome, curva:x.curva, qb, v, e, ec:Math.max(0, e - v * mesesAte), falta:Math.max(0, v * mesesAte - e),
      acaba: v > 0 ? addDays(hoje, Math.round(e / v * 30.4)) : null};
  });
  const Q = R.Q, sv = it.reduce((t, x) => t + x.v, 0);
  const f = T => it.reduce((t, x) => t + Math.max(0, T * x.v - x.ec), 0);
  let T = 0;
  if (Q > 0 && sv > 0) { let lo = 0, hi = 1; while (f(hi) < Q && hi < 1e5) hi *= 2; for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (f(m) < Q) lo = m; else hi = m; } T = (lo + hi) / 2; }
  it.forEach(x => { x.raw = Math.max(0, T * x.v - x.ec); x.sug = Math.floor(x.raw); });
  let resto = Q - it.reduce((t, x) => t + x.sug, 0);
  [...it].sort((a, b) => (b.raw - b.sug) - (a.raw - a.sug)).forEach(x => { if (resto > 0 && (x.raw > 0 || sv === 0)) { x.sug++; resto--; } });
  if (resto > 0 && it.length) it[0].sug += resto;
  const sq = it.reduce((t, x) => t + x.qb, 0);
  it.forEach(x => { x.pctSug = Q ? x.sug / Q : null; x.cobSug = x.v > 0 ? (x.ec + x.sug) / x.v : null;
    x.part = sq > 0 ? Math.round(Q * x.qb / sq) : 0; x.cobPart = x.v > 0 ? (x.ec + x.part) / x.v : null;
    x.precisa = Math.max(0, x.v * (R.cob + R.seg) - x.ec); });
  return {it, T};
}

    const a = document.activeElement, ak = a && a.dataset ? a.dataset.k : null;
    mcRender();
    if (ak && MC.host) { const nx = MC.host.querySelector(`[data-k="${CSS.escape(ak)}"]`); if (nx) nx.focus(); }
  }, 0);
}
function mcBind(host) {
  let tBusca;
  host.addEventListener('mousedown', e => { MC.pendClick = !!e.target.closest('[data-a]'); });
  host.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.sug !== undefined) { if (t.value !== '') { MC.d.feriados.push({...MC_FER[+t.value]}); mcMudou(); mcRerender(); } return; }
    const k = t.dataset.k; if (!k) return;
    let v;
    if (t.dataset.t === 'bool') v = t.checked;
    else if (t.dataset.t === 'num') { v = mcParse(t.value); if (v !== null && t.dataset.pct) v = v / 100; if (v !== null && t.dataset.int) v = Math.round(v); }
    else if (t.dataset.t === 'date') v = t.value || null;
    else v = t.value;
    if (k === 'tipo') {
      const T = MC_TIPOS[v]; Object.assign(MC.d, {tipo:v, d_producao:T.prazos[0], d_transito:T.prazos[1], d_desembaraco:T.prazos[2],
        feriados:T.fer.map(i => ({...MC_FER[i]})), parcelas:T.parcelas.map(p => ({...p}))});
    } else mcSet(k, v);
    mcMudou();
    if (MC.pendClick) MC.pendClick = false; else mcRerender();
    if (k === 'lancamento') mcGarantir();
  });
  host.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.nome !== undefined) { MC.nome = t.value; return; }
    if (t.dataset.bq === undefined) return;
    const box = t.closest('.mc-busca'), drop = box.querySelector('.mc-drop'), q = t.value.trim();
    clearTimeout(tBusca);
    if (q.length < 2) { drop.hidden = true; return; }
    tBusca = setTimeout(async () => {
      const r = await sb.rpc('forecast_skus', {p_busca:q});
      if (t.value.trim() !== q) return;
      const lista = box.dataset.l, ja = new Set(MC.d[lista]);
      const rows = (r.data || []).filter(x => !ja.has(x.sku));
      rows.forEach(x => MC.nomes.set(x.sku, x.nome));
      box._rows = rows;
      drop.innerHTML = rows.length ? `<button type="button" data-a="add-todos"><b>+ Adicionar todos os ${rows.length} resultados</b></button>` +
        rows.map(x => `<button type="button" data-a="add-sku" data-v="${esc(x.sku)}"><span>${esc(x.nome)}</span><small>${esc(x.sku)} · ${fInt(x.unidades_12m)} un. em 12m${x.status && !/^ativo/i.test(x.status) ? ' · ' + esc(x.status) : ''}</small></button>`).join('')
        : '<div class="cell-nm" style="padding:8px">Nada encontrado.</div>';
      drop.hidden = false;
    }, 250);
  });
  host.addEventListener('click', e => {
    if (!e.target.closest('.mc-busca')) host.querySelectorAll('.mc-drop').forEach(x => x.hidden = true);
    MC.pendClick = false;
    const b = e.target.closest('[data-a]'); if (!b) { return; }
    const a = b.dataset.a, d = MC.d;
    if (a === 'add-sku' || a === 'add-todos') {
      const box = b.closest('.mc-busca'), lista = box.dataset.l;
      const novos = a === 'add-todos' ? (box._rows || []).map(x => x.sku) : [b.dataset.v];
      d[lista] = [...new Set([...d[lista], ...novos])];
      mcMudou(); mcRender(); mcGarantir();
      const inp = MC.host.querySelector(`.mc-busca[data-l="${lista}"] [data-bq]`); if (inp) inp.focus();
      return;
    }
    if (a === 'rm-sku') { const l = b.dataset.l; d[l] = d[l].filter(s => s !== b.dataset.v); mcMudou(); mcRender(); return; }
    if (a === 'rm') { d[b.dataset.l].splice(+b.dataset.v, 1); mcMudou(); mcRender(); return; }
    if (a === 'set') { mcSet(b.dataset.k, b.dataset.v); mcMudou(); mcRender(); return; }
    if (a === 'add-camp') { d.campanhas.push({mes:mcAddMes(mcMesAtual, 1), extra:.5}); mcMudou(); mcRender(); return; }
    if (a === 'add-fer') { d.feriados.push({nome:'', inicio:'', fim:''}); mcMudou(); mcRender(); return; }
    if (a === 'add-parc') { d.parcelas.push({rotulo:'Parcela', pct:0, base:'chegada', dias:0}); mcMudou(); mcRender(); return; }
    if (a === 'cen') { MC.cen = b.dataset.v; mcRender(); return; }
    if (a === 'tog') { const id = b.dataset.v; MC.fechados.has(id) ? MC.fechados.delete(id) : MC.fechados.add(id); mcSalvaFechados(); mcRender(); return; }
    if (a === 'tog-todos') { MC.fechados = b.dataset.v === 'fechar' ? new Set(MC_SECOES) : new Set(); mcSalvaFechados(); mcRender(); return; }
    if (a === 'nova') { MC.d = mcPadrao(); MC.id = null; MC.nome = ''; MC.dirty = false; MC.msg = ''; MC.confExcl = false; mcRender(); return; }
    if (a === 'abrir') { mcAbrir(+b.dataset.v); return; }
    if (a === 'salvar') { mcSalvar(false); return; }
    if (a === 'salvar-nova') { mcSalvar(true); return; }
    if (a === 'excluir') { mcExcluir(); return; }
  });
}

</script>
