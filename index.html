<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produto · Purpose Dados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
:root{
  --ff-serif:Georgia,'Times New Roman',serif;
  --ff-sans:'Inter','Helvetica Neue',Arial,sans-serif;
  --ff-mono:'Courier New',monospace;
  --pp-marrom:#4F2C1D;--pp-polen:#FFFEF3;--pp-branco:#FFFFFF;--pp-azul:#C0D0E0;--pp-bege:#D3B38D;
  --pp-verde:#736635;--pp-laranja:#924C2E;--pp-preto:#31261D;--pp-polen-deep:#F7F0DA;--pp-bege-soft:#EADBC2;
  --ok:#9DA354;--erro:#C0451D;--alerta:#D8A042;
  --text:#3E3025;--text-soft:#7A6B5C;--border:#EADBC2;
  --shadow-soft:0 1px 3px rgba(79,44,29,0.07);--shadow-med:0 4px 18px rgba(79,44,29,0.10);
  --r-sm:4px;--r-md:6px;--r-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff-serif);background:var(--pp-polen);color:var(--text);line-height:1.5;font-size:15px}
h1,h2,h3{font-family:var(--ff-serif);font-weight:normal;color:var(--pp-marrom)}
h1 em,h2 em,h3 em{font-style:italic;color:var(--pp-laranja)}
button{font-family:var(--ff-sans);cursor:pointer}
[hidden]{display:none!important}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--pp-branco);border-radius:var(--r-lg);box-shadow:var(--shadow-med);padding:40px 36px;width:100%;max-width:380px}
.login-card .logo{height:28px;margin-bottom:28px}
.login-card h2{font-size:22px;margin-bottom:6px}
.login-card p{font-family:var(--ff-sans);font-size:13px;color:var(--text-soft);margin-bottom:22px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-family:var(--ff-sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-soft);font-weight:600;margin-bottom:6px}
.input{font-family:var(--ff-sans);font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--pp-branco);color:var(--text);width:100%}
.input:focus{outline:none;border-color:var(--pp-marrom)}
.btn{font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--pp-marrom);color:var(--pp-polen)}
.btn:hover{background:#3D2117}
.btn.sec{background:transparent;color:var(--pp-marrom);border-color:var(--border)}
.btn.sec:hover{background:var(--pp-polen-deep)}
.btn.sm{padding:6px 12px;font-size:12px}
.login-err{font-family:var(--ff-sans);font-size:13px;color:var(--erro);margin-top:12px;min-height:18px}

/* APP SHELL */
#app{display:flex;min-height:100vh}
.side{width:228px;flex-shrink:0;transition:width .18s ease;background:var(--pp-marrom);color:#E8DECF;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .logo{height:18px;margin:26px 22px 8px;overflow:hidden}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.side-top .logo{flex:1;min-width:0;margin-right:0}
.side-toggle{background:none;border:0;color:#E8DECF;width:30px;height:30px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;margin:20px 10px 2px 0;flex-shrink:0}
.side-toggle:hover{background:rgba(255,254,243,.12);color:var(--pp-polen)}
.side-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
#app.collapsed .side{width:64px}
#app.collapsed .side .logo,#app.collapsed .side .sect,#app.collapsed .side .nav .lbl-nav,#app.collapsed .side-foot .email{display:none}
#app.collapsed .side-top{justify-content:center}
#app.collapsed .side-toggle{margin:20px 0 14px}
#app.collapsed .side-toggle svg{transform:rotate(180deg)}
#app.collapsed .nav{padding:0 8px}
#app.collapsed .nav button{justify-content:center;padding:10px 0}
#app.collapsed .side-foot{padding:14px 8px;text-align:center}
#app.collapsed .side-foot button{padding:5px 6px;font-size:11px}
.nav .lbl-nav{white-space:nowrap}
.side .logo svg,.login-card .logo svg{display:block;height:100%;width:auto;max-width:100%}
.side .sect{font-family:var(--ff-sans);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#BFA98F;padding:22px 22px 8px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#E8DECF;font-size:13.5px;padding:10px 12px;border-radius:var(--r-sm);text-align:left}
.nav button:hover,.nav button.active{background:rgba(255,254,243,.12);color:var(--pp-polen)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.side-foot{margin-top:auto;padding:18px 22px;border-top:1px solid rgba(255,254,243,.12);font-family:var(--ff-sans);font-size:12px}
.side-foot .email{color:#E8DECF;word-break:break-all;margin-bottom:8px}
.side-foot button{background:none;border:1px solid rgba(255,254,243,.3);color:var(--pp-polen);border-radius:var(--r-sm);padding:5px 10px;font-size:12px}
main{flex:1;min-width:0}
.wrap{max-width:1200px;margin:0 auto;padding:28px 28px 64px;transition:max-width .18s ease}
#app.collapsed .wrap{max-width:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:30px;line-height:1.15}
.top .sub{font-family:var(--ff-sans);font-size:13px;color:var(--text-soft);margin-top:4px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--ff-sans);font-size:12px;color:var(--text-soft)}
.select{font-family:var(--ff-sans);font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--pp-branco);color:var(--text)}
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:22px;font-family:var(--ff-sans)}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-soft);font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--pp-branco);color:var(--text)}
.chip:hover{background:var(--pp-polen-deep)}
.chip.on{background:var(--pp-marrom);border-color:var(--pp-marrom);color:var(--pp-polen)}
.pill-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-sans);font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--pp-bege-soft);color:var(--pp-marrom)}

/* CARDS */
.grid{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--pp-branco);border-radius:var(--r-md);box-shadow:var(--shadow-soft);padding:22px 24px;min-width:0}
.card h3{font-size:17px;margin-bottom:4px}
.card .hint{font-family:var(--ff-sans);font-size:12px;color:var(--text-soft);margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head .hint{margin-bottom:0}
.stat .lbl{font-family:var(--ff-sans);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-soft);font-weight:600;margin-bottom:8px}
.stat .val{font-family:var(--ff-serif);font-size:32px;color:var(--pp-marrom);font-weight:bold;line-height:1.05}
.stat.small .val{font-size:24px}
.stat .sub{font-family:var(--ff-sans);font-size:12.5px;color:var(--text-soft);margin-top:6px}
.delta{font-family:var(--ff-sans);font-size:12.5px;font-weight:600;margin-top:6px}
.delta.up{color:var(--ok)}.delta.down{color:var(--erro)}.delta.flat{color:var(--text-soft)}
.val.neg{color:var(--erro)!important}.val.warn{color:#8A6420!important}
.callout{font-family:var(--ff-sans);font-size:13px;line-height:1.55;padding:14px 18px;border-radius:var(--r-sm);margin-bottom:18px}
.callout.note{background:#FFF8EE;border-left:4px solid var(--pp-bege)}
.callout.erro{background:#FBEAE5;border-left:4px solid var(--erro)}
.callout.alerta{background:#FCF0DC;border-left:4px solid var(--alerta);color:#6B4E18}
.foot-note{font-family:var(--ff-sans);font-size:12px;color:var(--text-soft);line-height:1.6;margin-top:6px}

/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:5px;font-family:var(--ff-sans);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.bdg svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.b-heroi{background:#EDEBD9;color:#6E7330}.b-neutro{background:#FCF0DC;color:#8A6420}.b-ofensor{background:#FBE8DE;color:var(--erro)}
.b-cinza{background:var(--pp-bege-soft);color:var(--pp-marrom)}
.b-A{background:var(--pp-marrom);color:var(--pp-polen)}.b-B{background:var(--pp-bege);color:var(--pp-marrom)}.b-C{background:var(--pp-bege-soft);color:var(--text-soft)}
.b-fora{background:#FBE8DE;color:var(--erro)}.b-critico{background:#F6DDD2;color:#8F3A1B}.b-atencao{background:#FCF0DC;color:#8A6420}
.b-saudavel{background:#EDEBD9;color:#6E7330}.b-excesso{background:#E4EBF2;color:var(--pp-marrom)}.b-semgiro{background:var(--pp-bege-soft);color:var(--text-soft)}

/* RANKING STRIP */
.rank3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:14px}
.rank3 .n{font-family:var(--ff-serif);font-size:30px;font-weight:bold;color:var(--pp-marrom);line-height:1.1}
.rank3 .l{font-family:var(--ff-sans);font-size:12.5px;color:var(--text-soft)}
.stackbar{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;background:var(--pp-branco)}
.stackbar div{height:100%}

/* TOP LIST */
.toplist{list-style:none}
.toplist li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.toplist li:last-child{border-bottom:0}
.toplist .pos{font-family:var(--ff-sans);font-size:12px;color:var(--text-soft);font-weight:600}
.toplist .sku{font-family:var(--ff-sans);font-size:13px;font-weight:700;color:var(--pp-marrom)}
.toplist .nm{font-size:12.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toplist .rt{text-align:right;font-family:var(--ff-mono);font-size:13px}
.toplist .rt small{display:block;font-family:var(--ff-sans);font-size:11.5px;color:var(--text-soft)}

/* TABLE */
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-family:var(--ff-sans)}
.tbar .grow{flex:1}
.tbar .count{font-size:12px;color:var(--text-soft)}
.tscroll{overflow:auto;max-height:640px;border-radius:var(--r-md);border:1px solid var(--border)}
table.t{width:100%;border-collapse:collapse;background:var(--pp-branco);font-size:13px}
table.t th{position:sticky;top:0;z-index:1;background:var(--pp-marrom);color:var(--pp-polen);font-family:var(--ff-sans);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;padding:11px 10px;text-align:left;white-space:nowrap;line-height:1.3;vertical-align:bottom;cursor:pointer;user-select:none}
table.t th.num{text-align:right}
table.t th .arr{opacity:.7;margin-left:4px}
table.t td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
table.t td.num{font-family:var(--ff-mono);text-align:right;white-space:nowrap}
table.t tr:hover td{background:var(--pp-polen-deep)}
table.t th.hl{background:#3D2117}
table.t td.hl{background:#FFF6E3;font-weight:bold;color:var(--pp-marrom)}
.thumb{width:40px;height:40px;border-radius:4px;object-fit:cover;background:var(--pp-polen-deep);border:1px solid var(--border);flex-shrink:0}
.thumb.ph{display:inline-flex;align-items:center;justify-content:center;font-family:var(--ff-sans);font-size:9px;color:var(--text-soft)}
.skucell{display:flex;gap:10px;align-items:center}
.mtx{width:100%;border-collapse:separate;border-spacing:6px;font-family:var(--ff-sans)}
.mtx th{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-soft);font-weight:600;padding:4px;text-align:center}
.mtx td{border-radius:6px;padding:10px 6px;text-align:center;cursor:pointer;border:2px solid transparent}
.mtx td.on{border-color:var(--pp-marrom)}
.mtx td .n{font-family:var(--ff-serif);font-size:22px;font-weight:bold;color:var(--pp-marrom);display:block;line-height:1.1}
.mtx td .p{font-size:11px;color:var(--text-soft)}
.mtx td.tot{cursor:default;background:var(--pp-polen-deep)}
.regua{margin-bottom:16px}
.regua .hd{display:flex;justify-content:space-between;font-family:var(--ff-sans);font-size:12px;margin-bottom:6px}
.regua .hd b{color:var(--pp-marrom)}
.regua .bar{display:flex;gap:2px;height:22px;border-radius:4px;overflow:hidden;background:var(--pp-polen-deep)}
.regua .bar div{display:flex;align-items:center;justify-content:center;font-family:var(--ff-sans);font-size:11px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden}
.b-nfora{background:#FBE8DE;color:var(--erro)}.b-nbaixo{background:#F6DDD2;color:#8F3A1B}.b-nmedio{background:#FCF0DC;color:#8A6420}.b-nalto{background:#EDEBD9;color:#6E7330}
table.t tr.neg td{background:#FDF3EE}
table.t tr.tot td{font-weight:bold;background:var(--pp-polen-deep)}
.cell-sku{font-family:var(--ff-sans);font-weight:700;color:var(--pp-marrom);font-size:12.5px;white-space:nowrap}
td.wide{min-width:230px}
td.mid{min-width:150px}
.cell-nm{font-size:12.5px;color:var(--text-soft);max-width:320px;line-height:1.35}
.neg-txt{color:var(--erro)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-family:var(--ff-sans);font-size:12.5px;color:var(--text-soft)}
.pager button{background:var(--pp-branco);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 10px;color:var(--text);font-size:12.5px}
.pager button:disabled{opacity:.4;cursor:default}

/* CHANNEL/AREA CARDS */
.dcard{cursor:default;border:2px solid transparent}
.dcard.click{cursor:pointer}
.dcard.sel{border-color:var(--pp-marrom)}
.dcard.dim{opacity:.55}
.dcard .top-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.dcard .name{font-family:var(--ff-sans);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:var(--pp-marrom)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-family:var(--ff-sans);font-size:12.5px;margin-top:12px}
.kv span:nth-child(odd){color:var(--text-soft);white-space:nowrap}
.kv span:nth-child(even){text-align:right;font-family:var(--ff-mono);color:var(--text);font-size:12px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--ff-sans);font-size:12px;color:var(--text);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart-box{position:relative;height:300px}
.chart-box.tall{height:360px}.chart-box.short{height:240px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:var(--pp-branco);border:0;padding:6px 12px;font-size:12px;color:var(--text);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pp-marrom);color:var(--pp-polen)}

/* MULTISELECT */
.ms{position:relative}
.ms-btn{cursor:pointer;text-align:left;white-space:nowrap}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--pp-branco);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-med);padding:10px;min-width:240px;max-height:340px;overflow:auto;font-size:13px}
.ms-panel label{display:flex;align-items:center;gap:8px;padding:5px 4px;cursor:pointer}
.ms-panel label small{margin-left:auto;color:var(--text-soft)}
.ms-panel .acts{display:flex;gap:8px;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:6px}
.ms-panel .acts button{background:none;border:0;color:var(--pp-laranja);font-size:12px;font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.toggle input{accent-color:var(--pp-marrom)}

/* STATES */
.sk{background:linear-gradient(90deg,var(--pp-polen-deep),#FBF6E8,var(--pp-polen-deep));background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--r-md);min-height:110px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.err{font-family:var(--ff-sans);font-size:13px;color:var(--erro);padding:18px;background:#FBEAE5;border-radius:var(--r-md)}
.sim-ed{border:1px solid var(--border);border-radius:var(--r-sm);padding:18px;margin:0 0 18px;background:#FFFCF6}
.sim-row{display:flex;gap:14px;flex-wrap:wrap}.sim-row .field{margin-bottom:12px}
.sim-ed td .input{padding:7px 9px;font-size:13px}
.sim-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.sim-msg{font-family:var(--ff-sans);font-size:12.5px;color:var(--erro)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{font-family:var(--ff-sans);font-size:13px;color:var(--text-soft);padding:24px;text-align:center}

@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  #app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap}
  .side .logo{margin:14px 16px}
  .side-toggle{display:none}
  #app.collapsed .side{width:100%}
  #app.collapsed .side .logo,#app.collapsed .side .nav .lbl-nav{display:block}
  #app.collapsed .side .nav .lbl-nav{display:inline}
  .side .sect{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:0 8px 10px;width:100%}
  .nav button{white-space:nowrap;padding:8px 10px}
  .side-foot{display:none}
  .wrap{padding:20px 16px 48px}
  .g2,.g3,.rank3{grid-template-columns:1fr}
  .g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{padding:18px}
  .stat .val{font-size:22px}.stat.small .val{font-size:19px}
  .stat .lbl{letter-spacing:1px;font-size:10px}
  .top h1{font-size:24px}
}

/* SUBPÁGINAS */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:-4px 0 22px;font-family:var(--ff-sans);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px 9px;font-size:13.5px;font-weight:600;color:var(--text-soft);white-space:nowrap;margin-bottom:-1px}
.subtabs button:hover{color:var(--pp-marrom)}
.subtabs button.on{color:var(--pp-marrom);border-bottom-color:var(--pp-marrom)}

/* MODELO DE COMPRA */
.mc-topo{margin-bottom:18px}
.mc-topo-l{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.mc-topo-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--ff-sans)}
.mc-dirty{font-size:12px;color:#8A6420;font-weight:600}
.mc-msg{font-size:12.5px;color:var(--text-soft)}
.mc-del{color:var(--erro)!important;border-color:#F2C9BB!important}
.mc-step{padding:0;overflow:visible;margin-bottom:18px}
.mc-step .mc-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.mc-head{display:flex;align-items:center;gap:0;width:100%;background:none;border:0;text-align:left;padding:18px 24px;border-radius:var(--r-md);flex-wrap:wrap;row-gap:4px}
.mc-head:hover{background:#FCF8EE}
.mc-head h3{font-size:19px;margin:0}
.mc-card{padding:0}
.mc-card .mc-head h3{font-size:17px}
.mc-card .mc-body{padding:0 24px 22px}
.mc-step .mc-head{border-bottom:1px solid var(--border);border-radius:var(--r-md) var(--r-md) 0 0}
.mc-chev{width:18px;height:18px;stroke:var(--text-soft);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-right:8px;transform:rotate(90deg);transition:transform .15s ease;flex-shrink:0}
.mc-resumo{display:none;margin-left:auto;padding-left:16px;font-family:var(--ff-sans);font-size:12.5px;color:var(--text-soft);text-align:right}
.fechado .mc-chev{transform:none}
.fechado .mc-body{display:none}
.fechado .mc-resumo{display:block}
.mc-step.fechado .mc-head{border-bottom:0;border-radius:var(--r-md)}
.mc-l{padding:22px 24px;min-width:0}
.mc-r{background:#FBF5E9;padding:22px 24px;border-left:1px solid var(--border);border-radius:0 0 var(--r-md) 0;min-width:0}
.mc-num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--pp-marrom);color:var(--pp-polen);font-family:var(--ff-sans);font-size:13px;font-weight:700;align-items:center;justify-content:center;margin-right:10px;flex-shrink:0}
.mc-r h4{font-family:var(--ff-sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-soft);font-weight:600;margin-bottom:8px}
.mc-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 14px}
.mc-fd span{display:flex;align-items:center;gap:6px;letter-spacing:1px}
.mc-fd .input{padding:8px 10px}
.input::placeholder{color:#B3A595}
.mc-q{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--pp-bege-soft);color:var(--pp-marrom);font-style:normal;font-size:10px;font-weight:700;cursor:help;letter-spacing:0;flex-shrink:0;text-transform:none}
.mc-chk .toggle{padding-top:8px}
.mc-res{padding:7px 0;border-bottom:1px dashed #E3D3B8}
.mc-res:last-child{border-bottom:0}
.mc-res .ln{display:flex;justify-content:space-between;gap:12px;font-family:var(--ff-sans);font-size:13px;align-items:baseline}
.mc-res .ln b{font-family:var(--ff-mono);color:var(--pp-marrom);white-space:nowrap;font-size:13.5px}
.mc-res .ct,.mc-ref .ct{font-family:var(--ff-sans);font-size:11.5px;color:var(--text-soft);margin-top:2px;line-height:1.45}
.mc-res.mc-tot .ln span{font-weight:600;color:var(--pp-marrom)}
.mc-res.mc-sel{background:#F5E9D2;margin:0 -8px;padding:7px 8px;border-radius:4px}
.mc-res.mc-neg .ln b{color:var(--erro)}
.mc-ref{padding:8px 0 10px;border-bottom:1px dashed #E3D3B8;font-family:var(--ff-sans);font-size:13px}
.mc-ref-h b{color:var(--pp-marrom)}
.mc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mc-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-sans);font-size:12.5px;background:var(--pp-polen-deep);border:1px solid var(--border);border-radius:999px;padding:3px 4px 3px 10px}
.mc-tag small{color:var(--text-soft)}
.mc-tag button{border:0;background:none;color:var(--text-soft);font-size:15px;line-height:1;width:20px;height:20px;border-radius:50%}
.mc-tag button:hover{background:#F2C9BB;color:var(--erro)}
.mc-busca{position:relative}
.mc-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:var(--pp-branco);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-med);max-height:320px;overflow:auto;padding:4px}
.mc-drop button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:7px 9px;border-radius:4px;font-size:13px;color:var(--text)}
.mc-drop button:hover{background:var(--pp-polen-deep)}
.mc-drop small{color:var(--text-soft);font-size:11.5px}
.mc-linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-family:var(--ff-sans)}
.mc-linha .input{padding:7px 9px;font-size:13px}
.mc-rm{border:0;background:none;color:var(--text-soft);width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.mc-rm:hover{background:#FBE8DE;color:var(--erro)}
.mc-rm svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mc-sub{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 12px 0;margin-bottom:12px}
.mc-l .seg{flex-wrap:wrap}
.mc-bars{display:flex;gap:3px;align-items:flex-end;height:70px;margin-top:12px}
.mc-bar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.mc-bar i{display:block;width:100%;border-radius:2px 2px 0 0}
.mc-bar span{font-family:var(--ff-sans);font-size:9.5px;color:var(--text-soft);margin-top:2px}
.mc-res-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:30px 0 14px}
.mc-res-h h2{font-size:26px}
.mc-tc td{font-family:var(--ff-sans)}
.mc-tc th small{font-weight:400;opacity:.8}
.mc-mm{max-height:none}
.mc-mm table.t td,.mc-mm table.t th{white-space:nowrap;padding:8px 9px}
.mc-mm .mc-fix{position:sticky;left:0;z-index:2;background:var(--pp-branco);font-family:var(--ff-sans);min-width:190px}
.mc-mm th.mc-fix{z-index:3;background:var(--pp-marrom)}
.mc-mm th.mc-cheg{background:var(--pp-laranja)}
.mc-mm td.mc-cheg{background:#FFF6E3}
.mc-mm tr.mc-blk td{background:var(--pp-polen-deep);font-weight:700;color:var(--pp-marrom);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.mc-mm td.mc-totc{font-weight:bold;background:var(--pp-polen-deep)}
.mc-tagm{font-size:9.5px;font-weight:600;letter-spacing:.5px;opacity:.85;text-transform:lowercase}
.mc-pos{color:#6E7330}
@media (max-width:980px){.mc-step .mc-body{grid-template-columns:1fr}.mc-r{border-left:0;border-top:1px solid var(--border);border-radius:0 0 var(--r-md) var(--r-md)}}
</style>
</head>

const n = v => (v === null || v === undefined || v === '') ? null : Number(v);
const fBRL = v => n(v) === null ? '—' : n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

  if (a >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' mi';

const fDate = s => s ? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : '—';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays = (s, k) => { const d = new Date(s+'T12:00:00'); d.setDate(d.getDate()+k); return iso(d); };
const diffDays = (a, b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5) + 1;

function delta(atual, anterior, modo='pct') {
  atual = n(atual); anterior = n(anterior);
  if (atual === null || anterior === null || (modo === 'pct' && anterior === 0)) return `<div class="delta flat">sem base no período anterior</div>`;
  const d = modo === 'pp' ? atual - anterior : (atual/anterior - 1) * 100;
  const cls = Math.abs(d) < 0.05 ? 'flat' : d > 0 ? 'up' : 'down';
  const seta = cls === 'flat' ? '■' : d > 0 ? '▲' : '▼';
  const txt = modo === 'pp' ? Math.abs(d).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' p.p.' : fPct(Math.abs(d));
  return `<div class="delta ${cls}">${seta} ${txt} vs período anterior</div>`;
}

function aplicaPreset(p) {
  const d = new Date(); const t = iso(d);
  if (p === 'hoje') { S.ini = t; S.fim = t; }
  else if (p === 'ontem') { S.ini = S.fim = addDays(t, -1); }
  else if (p === '7d') { S.ini = addDays(t, -6); S.fim = t; }
  else if (p === 'mes') { S.ini = t.slice(0,8)+'01'; S.fim = t; }
  else if (p === 'mes_ant') { const f = addDays(t.slice(0,8)+'01', -1); S.ini = f.slice(0,8)+'01'; S.fim = f; }
  else if (p === '90d') { S.ini = addDays(t, -89); S.fim = t; }

const cache = new Map();
function rpc(name, params) {
  const key = name + JSON.stringify(params);
  if (!cache.has(key)) {
    const p = sb.rpc(name, params).then(({data, error}) => { if (error) { cache.delete(key); throw error; } return data || []; });
    p.catch(() => cache.delete(key));
    cache.set(key, p);
  }
  return cache.get(key);
}
let renderToken = 0;
async function block(el, promise, fn) {
  const tk = renderToken;

function makeTable(host, cfg) {
  cfg.initPills = cfg.initPills || {};
  // cfg: columns[{key,label,num,fmt,html,sort}], rows, sort{key,dir}, search[keys], pills[{key,label,options}], selects[{key,label}], rowClass(r), exportName, total(rows)
  const st = {q:'', sort:{...cfg.sort}, page:0, size:50, pills:{...cfg.initPills}, selects:{}, extra:null, hidden:new Set(cfg.defaultHidden || [])};
  if (cfg.colsKey) { try { const sv = JSON.parse(localStorage.getItem('cols_' + cfg.colsKey) || 'null'); if (Array.isArray(sv)) st.hidden = new Set(sv); } catch (_) {} }
  const visCols = () => cfg.columns.filter(c => c.fixed || !st.hidden.has(c.key));
  const root = document.createElement('div'); host.appendChild(root);
  let rows = cfg.rows || [];
  const bar = document.createElement('div'); bar.className = 'tbar'; root.appendChild(bar);
  const scroll = document.createElement('div'); scroll.className = 'tscroll'; root.appendChild(scroll);
  const pager = document.createElement('div'); pager.className = 'pager'; root.appendChild(pager);

  function buildBar() {
    let h = '';
    if (cfg.search) h += `<input class="input" style="max-width:260px" placeholder="Buscar SKU ou nome…" data-q>`;
    (cfg.pills||[]).forEach(p => {
      const cur = st.pills[p.key] || [];
      h += `<div class="chips" data-pill="${p.key}"><button class="chip ${cur.length?'':'on'}" data-v="">${p.all||'Todos'}</button>${p.options.map(o => `<button class="chip ${cur.includes(o)?'on':''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    });
    (cfg.selects||[]).forEach(s => { h += `<span data-sel="${s.key}"></span>`; });
    if (cfg.extra) h += cfg.extra;
    if (cfg.colsKey) h += `<span data-cols></span>`;
    h += `<span class="grow"></span><span class="count" data-count></span>`;
    if (cfg.exportName) h += `<button class="btn sec sm" data-csv>Exportar CSV</button>`;
    bar.innerHTML = h;
    const q = bar.querySelector('[data-q]');
    if (q) { q.value = st.q; let t; q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { st.q = q.value; st.page = 0; draw(); }, 250); }); }
    bar.querySelectorAll('[data-pill]').forEach(g => g.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const k = g.dataset.pill, v = b.dataset.v, cur = st.pills[k] || [];
      const opts = (cfg.pills.find(p => p.key === k) || {options:[]}).options;
      let nx = !v ? [] : cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v];
      if (nx.length === opts.length) nx = [];
      api.setFilter(k, nx);
    }));
    bar.querySelectorAll('[data-sel]').forEach(sp => {
      const k = sp.dataset.sel, s = cfg.selects.find(x => x.key === k);
      const opts = [...new Set(rows.map(r => r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
      sp.replaceWith(msel(s.label, opts, st.selects[k] || [], v => { st.selects[k] = v; st.page = 0; draw(); }));
    });
    const c = bar.querySelector('[data-csv]'); if (c) c.addEventListener('click', exportCSV);
    const cs = bar.querySelector('[data-cols]');
    if (cs) {
      const opts = cfg.columns.filter(c => !c.fixed);
      const w = el(`<div class="ms"><button class="select ms-btn" type="button">Colunas ▾</button><div class="ms-panel" hidden><div class="acts"><button data-a="all" type="button">Mostrar todas</button></div>${opts.map(c => `<label><input type="checkbox" value="${c.key}" ${st.hidden.has(c.key)?'':'checked'}> ${c.label.replace(/<br>/g,' ')}</label>`).join('')}</div></div>`);
      const btn = w.querySelector('.ms-btn'), panel = w.querySelector('.ms-panel');
      const save = () => { try { localStorage.setItem('cols_' + cfg.colsKey, JSON.stringify([...st.hidden])); } catch (_) {} };
      btn.addEventListener('click', () => panel.hidden = !panel.hidden);
      panel.addEventListener('change', e => { const k = e.target.value; if (e.target.checked) st.hidden.delete(k); else st.hidden.add(k); save(); draw(); });
      panel.addEventListener('click', e => { if (e.target.dataset && e.target.dataset.a === 'all') { st.hidden.clear(); panel.querySelectorAll('input').forEach(i => i.checked = true); save(); draw(); } });
      cs.replaceWith(w);
    }
    if (cfg.onBar) cfg.onBar(bar);
  }
  function filtered() {
    let r = rows;
    const q = st.q.trim().toLowerCase();
    if (q) r = r.filter(x => (cfg.search||[]).some(k => String(x[k]??'').toLowerCase().includes(q)));
    Object.entries(st.pills).forEach(([k,v]) => { if (v && v.length) r = r.filter(x => v.includes(x[k])); });
    Object.entries(st.selects).forEach(([k,v]) => { if (v && v.length) r = r.filter(x => v.includes(x[k])); });
    if (cfg.filter) r = r.filter(cfg.filter);
    if (st.extra) r = r.filter(st.extra);
    const col = cfg.columns.find(c => c.key === st.sort.key);
    if (col) {
      const f = col.sort || (x => x[col.key]);
      const dir = st.sort.dir === 'asc' ? 1 : -1;
      r = [...r].sort((a,b) => {
        let va = f(a), vb = f(b);
        const na = va === null || va === undefined || va === '', nb = vb === null || vb === undefined || vb === '';
        if (na && nb) return 0; if (na) return 1; if (nb) return -1;
        if (col.num || typeof va === 'number') return (Number(va) - Number(vb)) * dir;
        return String(va).localeCompare(String(vb),'pt-BR') * dir;
      });
    }
    return r;
  }
  function draw() {
    const r = filtered();
    const pages = Math.max(1, Math.ceil(r.length / st.size));
    if (st.page >= pages) st.page = pages - 1;
    const slice = r.slice(st.page*st.size, (st.page+1)*st.size);
    const cols = visCols();
    const th = cols.map(c => `<th class="${c.num?'num':''} ${c.hl?'hl':''}" data-k="${c.key}">${c.label}${st.sort.key===c.key ? `<span class="arr">${st.sort.dir==='asc'?'↑':'↓'}</span>`:''}</th>`).join('');
    const td = slice.map(x => `<tr class="${cfg.rowClass ? cfg.rowClass(x) : ''}">${cols.map(c => `<td class="${c.num?'num':''} ${c.w||''} ${c.hl?'hl':''}">${c.html ? c.html(x) : c.fmt ? c.fmt(x[c.key]) : esc(x[c.key] ?? '—')}</td>`).join('')}</tr>`).join('');
    const tot = cfg.total && r.length ? `<tr class="tot">${cols.map((c,i) => { const t = cfg.total(r); return `<td class="${c.num?'num':''}">${t[c.key] !== undefined ? t[c.key] : (i===0?'Total':'')}</td>`; }).join('')}</tr>` : '';
    scroll.innerHTML = r.length ? `<table class="t"><thead><tr>${th}</tr></thead><tbody>${td}${tot}</tbody></table>` : `<div class="empty">Nenhum item encontrado com esses filtros.</div>`;
    scroll.querySelectorAll('th').forEach(h => h.addEventListener('click', () => {
      const k = h.dataset.k; const col = cfg.columns.find(c => c.key === k);
      st.sort = st.sort.key === k ? {key:k, dir: st.sort.dir === 'asc' ? 'desc' : 'asc'} : {key:k, dir: col.num ? 'desc' : 'asc'};
      st.page = 0; draw();
    }));
    const cnt = bar.querySelector('[data-count]'); if (cnt) cnt.textContent = r.length.toLocaleString('pt-BR') + ' itens';
    const a = r.length ? st.page*st.size + 1 : 0, b = Math.min(r.length, (st.page+1)*st.size);
    pager.innerHTML = r.length <= 25 ? '' : `<span>Linhas por página: <select class="select" data-size>${[25,50,100].map(s=>`<option ${s===st.size?'selected':''}>${s}</option>`).join('')}</select></span>
      <span><button data-prev ${st.page===0?'disabled':''}>‹ Anterior</button> &nbsp;${a.toLocaleString('pt-BR')}–${b.toLocaleString('pt-BR')} de ${r.length.toLocaleString('pt-BR')}&nbsp; <button data-next ${st.page>=pages-1?'disabled':''}>Próxima ›</button></span>`;
    const sz = pager.querySelector('[data-size]'); if (sz) sz.addEventListener('change', () => { st.size = +sz.value; st.page = 0; draw(); });
    const pv = pager.querySelector('[data-prev]'); if (pv) pv.addEventListener('click', () => { st.page--; draw(); });
    const nx = pager.querySelector('[data-next]'); if (nx) nx.addEventListener('click', () => { st.page++; draw(); });
  }
  function exportCSV() {
    const r = filtered();
    const cols = visCols().filter(c => !c.noExport && !c.noCsv);
    const val = (c, x) => { let v = c.csv ? c.csv(x) : x[c.key]; if (v === null || v === undefined) return '';
      if (typeof v === 'number' || (c.num && !isNaN(Number(v)))) return String(v).replace('.', ',');
      return '"' + String(v).replace(/"/g,'""') + '"'; };
    const lines = [cols.map(c => '"' + c.label.replace(/<br>/g,' ').replace(/<[^>]+>/g,'') + '"').join(';'), ...r.map(x => cols.map(c => val(c,x)).join(';'))];
    const blob = new Blob(['﻿' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${cfg.exportName}_${S.ini||S.dataRef}_${S.fim||''}.csv`.replace(/_\.csv$/,'.csv'); a.click();
  }
  const api = {
    setRows(nr) { rows = nr; buildBar(); draw(); },
    setFilter(k, v) { v = Array.isArray(v) ? v : (v ? [v] : []); st.pills[k] = v; st.page = 0;
      const g = bar.querySelector(`[data-pill="${k}"]`);
      if (g) g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v ? v.includes(b.dataset.v) : v.length === 0));
      draw(); },
    redraw() { st.page = 0; draw(); },
    setExtra(fn) { st.extra = fn; st.page = 0; draw(); },
    filteredRows() { return filtered(); }
  };
  buildBar(); draw();
  return api;
}

  document.querySelectorAll('#nav button').forEach((b, i) => b.title = VIEWS[i].label);
}
function renderTop() {
  const v = subAtual() || VIEWS.find(x => x.id === S.view);
  document.getElementById('title').innerHTML = v.title;
  document.getElementById('subtitle').textContent = v.sub;
  const tr = document.getElementById('top-right');
  if (S.view === 'estoque' && subAtual().id === 'modelo') { tr.innerHTML = ''; return; }
  if (S.view === 'estoque' || S.view === 'lancamentos') {
    tr.innerHTML = `<span class="flabel">Posição em</span><input type="date" class="select" id="dref" value="${S.dataRef}" max="${hoje}">
      <span id="upd"></span><button class="btn sec sm" id="refresh">Atualizar agora</button>`;
    tr.querySelector('#dref').addEventListener('change', e => { if (e.target.value) { S.dataRef = e.target.value; renderView(); } });
  } else {
    tr.innerHTML = `<select class="select" id="preset">${PRESETS.map(([k,l]) => `<option value="${k}" ${S.preset===k?'selected':''}>${l}</option>`).join('')}</select>
      <span id="custom" ${S.preset==='custom'?'':'hidden'}><input type="date" class="select" id="d-ini" value="${S.ini}"> até <input type="date" class="select" id="d-fim" value="${S.fim}"></span>
      <span class="pill-badge">${fDate(S.ini)} – ${fDate(S.fim)}</span>
      <span id="upd"></span><button class="btn sec sm" id="refresh">Atualizar agora</button>`;
    tr.querySelector('#preset').addEventListener('change', e => {
      if (e.target.value === 'custom') { S.preset = 'custom'; renderTop(); return; }
      aplicaPreset(e.target.value); renderTop(); renderView(); });
    const upd = () => { const a = tr.querySelector('#d-ini').value, b = tr.querySelector('#d-fim').value; if (a && b && a <= b) { S.ini = a; S.fim = b; S.preset = 'custom'; renderTop(); renderView(); } };
    tr.querySelector('#d-ini').addEventListener('change', upd); tr.querySelector('#d-fim').addEventListener('change', upd);
  }
  tr.querySelector('#refresh').addEventListener('click', () => { cache.clear(); renderView(); });
  if (S.atualizado) carimbo();
}
function chipsMulti(label, options, current, onChange, allLabel='Todos') {
  const g = el(`<div class="fgroup"><span class="flabel">${label}</span><div class="chips"></div></div>`);
  const c = g.querySelector('.chips');
  const all = el(`<button class="chip ${current.length===0?'on':''}">${allLabel}</button>`);
  all.addEventListener('click', () => onChange([])); c.appendChild(all);
  options.forEach(o => {
    const b = el(`<button class="chip ${current.includes(o)?'on':''}">${esc(o)}</button>`);
    b.addEventListener('click', () => { const nx = current.includes(o) ? current.filter(x => x !== o) : [...current, o]; onChange(nx.length === options.length ? [] : nx); });
    c.appendChild(b);
  });
  return g;
}
function msel(label, options, selected, onChange) {
  // dropdown com checkboxes; selected = [] significa "todas"
  const w = el(`<div class="ms"><button class="select ms-btn" type="button"></button><div class="ms-panel" hidden></div></div>`);
  const btn = w.querySelector('.ms-btn'), panel = w.querySelector('.ms-panel');
  let sel = [...selected];
  const lbl = () => btn.textContent = `${label}: ${sel.length === 0 ? 'todas' : sel.length === 1 ? sel[0] : sel.length + ' selecionadas'} ▾`;
  const draw = () => { panel.innerHTML = `<div class="acts"><button data-a="all" type="button">Todas</button><button data-a="none" type="button">Limpar</button></div>` +
    options.map(o => `<label><input type="checkbox" value="${esc(o)}" ${sel.includes(o)?'checked':''}> ${esc(o)}</label>`).join(''); };
  lbl(); draw();
  btn.addEventListener('click', () => { panel.hidden = !panel.hidden; });
  panel.addEventListener('click', e => { const a = e.target.dataset && e.target.dataset.a; if (!a) return; sel = []; draw(); lbl(); onChange(sel); });
  panel.addEventListener('change', () => { sel = [...panel.querySelectorAll('input:checked')].map(i => i.value); if (sel.length === options.length) sel = []; lbl(); onChange(sel); });
  return w;
}
function chipsGroup(label, options, current, onPick, allLabel='Todos') {
  const g = el(`<div class="fgroup"><span class="flabel">${label}</span><div class="chips"></div></div>`);
  const c = g.querySelector('.chips');
  [[null, allLabel], ...options.map(o => [o, o])].forEach(([v, l]) => {
    const b = el(`<button class="chip ${v===current?'on':''}">${esc(l)}</button>`);
    b.addEventListener('click', () => onPick(v)); c.appendChild(b);
  });
  return g;
}
function renderView() {
  renderToken++; destroyCharts();
  const f = document.getElementById('filters'); f.innerHTML = '';
  const v = document.getElementById('view'); v.innerHTML = '';
  const tabs = document.getElementById('subtabs'), subs = SUBVIEWS[S.view];

}

/* ================= VIEW: ESTOQUE ================= */
function viewEstoque(v, f) {
  const jan = chipsGroup('Janela de consumo', ['30','60','90','180'], String(S.janela), x => { S.janela = +(x || 90); renderView(); }, '');
  jan.querySelector('.chips').firstElementChild.remove();
  jan.querySelectorAll('.chip').forEach(b => b.textContent += ' dias');
  f.appendChild(jan);
  const ms = el(`<div class="fgroup ms"><span class="flabel">Categorias</span><button class="chip" id="ms-btn"></button><div class="ms-panel" hidden></div></div>`);
  f.appendChild(ms);
  const cons = el(`<div class="fgroup"><span class="flabel">Tirar do consumo</span><div class="chips"><button class="chip ${S.exclTransf?'on':''}" data-x="t" title="Remessa para depósito fechado ou armazém geral">Transferências p/ depósito</button><button class="chip ${S.exclEventos?'on':''}" data-x="e" title="Remessa para venda fora do estabelecimento">Remessas p/ eventos</button></div></div>`);
  cons.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.x === 't') S.exclTransf = !S.exclTransf; else S.exclEventos = !S.exclEventos; renderView(); });
  f.appendChild(cons);
  const carga = el(`<span class="pill-badge" id="carga">Carregando…</span>`); f.appendChild(carga);

  rpc('estoque_ultima_carga', {}).then(r => {
    const x = r[0] || {};
    carga.textContent = 'Movimentações até ' + fDate(x.ultima_data_movimento);
    if (x.ultima_importacao && (Date.now() - new Date(x.ultima_importacao)) > 36*3600e3)
      v.insertAdjacentHTML('afterbegin', `<div class="callout alerta">Estoque não atualizado hoje — rode a rotina de importação do WMS.</div>`);
  }).catch(() => carga.textContent = 'Movimentações: —');

  rpc('estoque_categorias', {}).then(cats => {
    S.catsAll = cats;
    if (!S.catsDefault) { S.catsDefault = cats.filter(c => c.padrao_incluir).map(c => c.categoria); if (!S.categorias) S.categorias = [...S.catsDefault]; }
    const btn = ms.querySelector('#ms-btn'), panel = ms.querySelector('.ms-panel');
    const label = () => btn.textContent = (S.categorias.length === cats.length ? 'Todas' : S.categorias.length + ' de ' + cats.length) + ' ▾';
    label();
    panel.innerHTML = `<div class="acts"><button data-a="all">Todas</button><button data-a="none">Limpar</button><button data-a="ok" style="margin-left:auto">Aplicar</button></div>` +
      cats.map(c => `<label><input type="checkbox" value="${esc(c.categoria)}" ${S.categorias.includes(c.categoria)?'checked':''}> ${esc(c.categoria)} <small>${c.skus}</small></label>`).join('');
    btn.addEventListener('click', () => panel.hidden = !panel.hidden);
    panel.addEventListener('click', e => {
      const a = e.target.dataset && e.target.dataset.a; if (!a) return;
      if (a === 'all' || a === 'none') panel.querySelectorAll('input').forEach(i => i.checked = a === 'all');
      if (a === 'ok') { S.categorias = [...panel.querySelectorAll('input:checked')].map(i => i.value); panel.hidden = true; renderView(); }
    });
    carregar();
  }).catch(e => { v.innerHTML = `<div class="err">Não foi possível carregar as categorias. ${esc(e.message||'')}</div>`; });

  function carregar() {
    const pCats = S.categorias && S.catsAll && S.categorias.length === S.catsAll.length ? null : S.categorias;
    const p = rpc('produto_estoque3', {data_ref:S.dataRef, p_janela_dias:S.janela, p_categorias:pCats, p_excluir_transferencias:S.exclTransf, p_excluir_eventos:S.exclEventos});
    p.finally(carimbo);
    // margem de produto do SKU na mesma janela do consumo (vendas do Tiny)
    const mIni = addDays(S.dataRef, -(S.janela - 1));
    const pPerf = rpc('produto_performance', {data_inicio:mIni, data_fim:S.dataRef, p_canais:null, p_areas:null, p_nivel:'sku', p_somente_ativos:false}).catch(e => { console.error('[dash] margem', e); return null; });
    const classe = (mc, fl, semc) => semc ? 'Sem custo' : !(fl > 0) ? 'Sem venda' : 100*mc/fl >= 37.5 ? 'Herói' : 100*mc/fl >= 15 ? 'Neutro' : 'Ofensor';
    const pAll = Promise.all([p, pPerf]).then(([est, perf]) => {
      const m = new Map((perf || []).map(r => [r.item, r]));
      return est.map(r => { const x = m.get(r.sku);
        return {...r, _mc: x ? n(x.mc) : 0, _fl: x ? n(x.faturamento_liquido) : 0, _semc: !!(x && x.sem_custo),
          classificacao: !perf ? '—' : x ? (x.classificacao === 'Só bonificação' ? 'Sem venda' : x.classificacao) : 'Sem venda',
          mc_pct: x ? n(x.mc_pct) : null}; });
    });
    const NIVEIS = ['FORA DE ESTOQUE','BAIXO','MÉDIO','ALTO'];
    const NIV_CLS = {'FORA DE ESTOQUE':'b-nfora','BAIXO':'b-nbaixo','MÉDIO':'b-nmedio','ALTO':'b-nalto'};
    const NIV_LBL = {'FORA DE ESTOQUE':'Fora','BAIXO':'Baixo','MÉDIO':'Médio','ALTO':'Alto'};
    const badgeNiv = x => `<span class="bdg ${NIV_CLS[x]||'b-cinza'}">${esc(x === 'FORA DE ESTOQUE' ? 'Fora de estoque' : (x||'—'))}</span>`;
    const ativos = rows => rows.filter(r => r.status === 'Ativo');
    let tabela, matrizSel = null;

    const kp = div(v), al = div(v), g = div(v, 'grid g2'), cM = div(g, 'card'), cR = div(g, 'card'), ct = div(v, 'card'), ck = div(v, 'card'), cs = div(v, 'card');
    simulacoes(cs);
    ct.style.marginBottom = '18px';

    block(kp, p, rows => {
      const at = ativos(rows), tot = at.length || 1;
      const cnt = nv => at.filter(r => r.nivel === nv).length;
      const aBaixo = at.filter(r => r.curva === 'A' && (r.nivel === 'BAIXO' || r.nivel === 'FORA DE ESTOQUE')).length;
      const card = (lbl, val, sub, cls='') => `<div class="card stat small"><div class="lbl">${lbl}</div><div class="val ${cls}">${val}</div><div class="sub">${sub}</div></div>`;
      kp.innerHTML = `<div class="grid g6">
        ${card('SKUs monitorados', fInt(at.length), `${fInt(sum(at,'estoque_disponivel'))} unidades disponíveis`)}
        ${card('Fora de estoque', fInt(cnt('FORA DE ESTOQUE')), fPct(100*cnt('FORA DE ESTOQUE')/tot) + ' dos SKUs', 'neg')}
        ${card('Nível baixo', fInt(cnt('BAIXO')), fPct(100*cnt('BAIXO')/tot) + ' dos SKUs', 'neg')}
        ${card('Nível médio', fInt(cnt('MÉDIO')), fPct(100*cnt('MÉDIO')/tot) + ' dos SKUs', 'warn')}
        ${card('Nível alto', fInt(cnt('ALTO')), fPct(100*cnt('ALTO')/tot) + ' dos SKUs')}
        ${card('Curva A baixa ou fora', fInt(aBaixo), 'prioridade de reposição', aBaixo ? 'neg' : '')}
      </div>`;
      const negs = at.filter(r => n(r.estoque_fulfillment) < 0);
      const avisos = [];
      if (rows.length && rows[0].eh_atual === false) avisos.push(`<div class="callout note">Data de referência no passado: fulfillment, em expedição e reserva só existem para hoje — nesta data o disponível é o saldo das movimentações.</div>`);
      if (negs.length) avisos.push(`<div class="callout erro"><strong>${negs.length} SKUs com estoque negativo no fulfillment</strong> — provável ajuste de cadastro ou movimentação pendente: ${negs.map(r => `${esc(r.sku)} (${fInt(r.estoque_fulfillment)})`).join(' · ')}</div>`);
      al.innerHTML = avisos.join('');
    });

    const drawMatriz = rows => {
      const at = ativos(rows);
      const cel = (c, nv) => { const tc = at.filter(r => r.curva === c).length, k = at.filter(r => r.curva === c && r.nivel === nv).length;
        return `<td class="${NIV_CLS[nv]} ${matrizSel && matrizSel[0] === c && matrizSel[1] === nv ? 'on' : ''}" data-c="${c}" data-n="${nv}"><span class="n">${k}</span><span class="p">${fPct(tc ? 100*k/tc : 0)} da curva</span></td>`; };
      cM.innerHTML = `<h3>Matriz curva ABC × <em>nível de estoque</em></h3><div class="hint">SKUs ativos · clique numa célula para filtrar a tabela, clique de novo para limpar</div>
        <table class="mtx"><thead><tr><th>Curva</th>${NIVEIS.map(nv => `<th>${NIV_LBL[nv]}</th>`).join('')}<th>Total</th></tr></thead><tbody>
        ${['A','B','C'].map(c => `<tr><th>${badgeCurva(c)}</th>${NIVEIS.map(nv => cel(c, nv)).join('')}<td class="tot"><span class="n">${at.filter(r => r.curva === c).length}</span></td></tr>`).join('')}
        </tbody></table>`;
      cM.querySelectorAll('td[data-c]').forEach(td => td.addEventListener('click', () => {
        const sel = [td.dataset.c, td.dataset.n];
        matrizSel = matrizSel && matrizSel[0] === sel[0] && matrizSel[1] === sel[1] ? null : sel;
        if (tabela) { tabela.setFilter('curva', matrizSel ? [matrizSel[0]] : []); tabela.setFilter('nivel', matrizSel ? [matrizSel[1]] : []); if (matrizSel) tabela.setFilter('status', ['Ativo']); }
        drawMatriz(rows); if (matrizSel) ct.scrollIntoView({behavior:'smooth'});
      }));
    };
    block(cM, p, drawMatriz);

    block(cR, Promise.all([p, sb.from('parametros_estoque').select('*').then(({data}) => data, () => null)]), ([rows, par]) => {
      const at = ativos(rows);
      const lim = {A:[100,200], B:[80,120], C:[50,80]};
      (par || []).forEach(x => { lim[x.curva] = [n(x.limite_baixo), n(x.limite_medio)]; });
      cR.innerHTML = `<h3>Régua de nível <em>por curva</em></h3><div class="hint">estoque disponível (unidades) que define cada nível · nº de SKUs ativos em cada faixa</div>` +
        ['A','B','C'].map(c => { const [b, m] = lim[c]; const tc = at.filter(r => r.curva === c);
          const segs = NIVEIS.map(nv => [nv, tc.filter(r => r.nivel === nv).length]);
          return `<div class="regua"><div class="hd"><span>${badgeCurva(c)} <b style="margin-left:6px">Curva ${c}</b></span><span style="color:var(--text-soft)">Fora: 0 · Baixo: 1–${b - 1} · Médio: ${b}–${m - 1} · Alto: ≥ ${m}</span></div>
            <div class="bar">${segs.filter(([, k]) => k > 0).map(([nv, k]) => `<div class="${NIV_CLS[nv]}" style="flex:${k} 1 0;min-width:62px" title="${NIV_LBL[nv]}: ${k} SKUs">${NIV_LBL[nv]} ${k}</div>`).join('') || '<div style="flex:1;color:var(--text-soft)">sem SKUs</div>'}</div></div>`; }).join('') +
        '';
    });

    block(ct, pAll, rows => {
      ct.innerHTML = `<div class="card-head"><div><h3>Posição por <em>SKU</em></h3><div class="hint">disponível = fulfillment − em expedição − reserva de emergência (10%, mín. 5) · margem dos últimos ${S.janela} dias (${fDate(mIni)} a ${fDate(S.dataRef)}) · padrão: só produtos ativos</div></div></div>`;
      const ordemNiv = x => NIVEIS.indexOf(x);
      const agrupar = rs => {
        const m = new Map();
        rs.forEach(r => { const k = r.nome_geral; if (!m.has(k)) m.set(k, {...r, sku:'', skus:0, imagem_url:r.imagem_url, estoque_fulfillment:0, em_expedicao:0, reserva:0, estoque_disponivel:0, no_site:0, no_site_ilimitado:false, consumo_medio_dia:0, consumo_medio_mes:0, dias_fora_estoque:null, fora_desde:null, curva:null, risco_quebra:false, _mcS:0, _flS:0, _semcS:false, _nivO:99});
          const g = m.get(k); g.skus++; g.sku = g.skus + ' SKUs'; g.nome_sku = g.skus + ' SKUs';
          ['estoque_fulfillment','em_expedicao','reserva','estoque_disponivel','consumo_medio_dia','consumo_medio_mes','no_site'].forEach(c => g[c] += n(r[c]) || 0);
          g.no_site_ilimitado = g.no_site_ilimitado || r.no_site_ilimitado;
          if (!g.imagem_url && r.imagem_url) g.imagem_url = r.imagem_url;
          if (r.curva && (!g.curva || r.curva < g.curva)) g.curva = r.curva;
          if (r.status === 'Ativo') g.status = 'Ativo';
          if (ordemNiv(r.nivel) < g._nivO) { g._nivO = ordemNiv(r.nivel); g.nivel = r.nivel; }
          g.risco_quebra = g.risco_quebra || r.risco_quebra;
          if (n(r.dias_fora_estoque) !== null && (g.dias_fora_estoque === null || n(r.dias_fora_estoque) > g.dias_fora_estoque)) { g.dias_fora_estoque = n(r.dias_fora_estoque); g.fora_desde = r.fora_desde; }
          if (r.ultima_entrada && (!g.ultima_entrada || r.ultima_entrada > g.ultima_entrada)) g.ultima_entrada = r.ultima_entrada;
          g._mcS += r._mc || 0; g._flS += r._fl || 0; g._semcS = g._semcS || r._semc; });
        return [...m.values()].map(g => { g.consumo_medio_dia = Math.round(g.consumo_medio_dia * 100) / 100;
          g.dias_estoque = g.estoque_disponivel > 0 && g.consumo_medio_dia > 0 ? Math.round(g.estoque_disponivel / g.consumo_medio_dia) : null;
          g.classificacao = classe(g._mcS, g._flS, g._semcS); g.mc_pct = g._flS > 0 ? Math.round(1000 * g._mcS / g._flS) / 10 : null; return g; });
      };
      let agrupado = false, soRisco = false;
      const prep = rs => rs.map(r => ({...r, _niv: ordemNiv(r.nivel)}));
      const base = prep(rows);
      const nRisco = rows.filter(r => r.risco_quebra).length;
      const statusOpts = [...new Set(rows.map(r => r.status))].sort();
      tabela = makeTable(ct, {
        rows: base, exportName:'estoque_posicao', search:['sku','nome_sku','nome_geral'], sort:{key:'_niv', dir:'asc'},
        initPills:{status:['Ativo']}, colsKey:'estoque_v2',
        pills:[{key:'status', options:statusOpts, all:'Todos os status'}, {key:'curva', options:['A','B','C'], all:'Todas as curvas'}, {key:'nivel', options:NIVEIS, all:'Todos os níveis'}, {key:'classificacao', options:['Herói','Neutro','Ofensor','Sem custo','Sem venda'], all:'Toda margem'}],
        selects:[{key:'categoria',label:'Categoria'},{key:'linha',label:'Linha'},{key:'area_origem',label:'Área'}],
        extra:`<label class="toggle"><input type="checkbox" data-risco> Risco de quebra (${nRisco})</label><label class="toggle"><input type="checkbox" data-agr> Agrupar por nome geral</label>`,
        onBar: bar => {
          const t = bar.querySelector('[data-agr]'); t.checked = agrupado;
          t.addEventListener('change', () => { agrupado = t.checked; tabela.setRows(agrupado ? prep(agrupar(rows)) : base); });
          const rk = bar.querySelector('[data-risco]'); rk.checked = soRisco;
          rk.addEventListener('change', () => { soRisco = rk.checked; tabela.setExtra(soRisco ? (r => r.risco_quebra) : null); });
        },
        rowClass: r => r.status === 'Ativo' && r.curva === 'A' && (r.nivel === 'FORA DE ESTOQUE' || r.nivel === 'BAIXO') ? 'neg' : '',
        columns:[
          {key:'sku', label:'SKU', w:'wide', fixed:true, html:r => `<div class="skucell">${r.imagem_url ? `<img class="thumb" loading="lazy" src="${esc(r.imagem_url)}" alt="">` : '<span class="thumb ph">sem foto</span>'}<div><div class="cell-sku">${esc(r.sku)}</div>${r.risco_quebra ? '<span class="bdg b-fora" title="Site anuncia mais do que o disponível">risco de quebra</span>' : ''}</div></div>`},
          {key:'nome_sku', label:'Nome por SKU', w:'mid', html:r => `<span class="cell-nm">${esc(r.nome_sku)}</span>`},
          {key:'nome_geral', label:'Nome geral', w:'mid', html:r => `<span class="cell-nm">${esc(r.nome_geral)}</span>`},
          {key:'categoria', label:'Categoria'},
          {key:'curva', label:'Curva', html:r => r.curva ? badgeCurva(r.curva) : '<span class="bdg b-cinza">Inativo</span>'},
          {key:'_niv', label:'Nível', html:r => badgeNiv(r.nivel), csv:r => r.nivel},
          {key:'estoque_fulfillment', label:'Estoque<br>fulfillment', num:true, html:r => `<span class="${n(r.estoque_fulfillment)<0?'neg-txt':''}">${fInt(r.estoque_fulfillment)}</span>`, csv:r => r.estoque_fulfillment},
          {key:'em_expedicao', label:'Em<br>expedição', num:true, fmt:fInt},
          {key:'reserva', label:'Reserva de<br>emergência', num:true, fmt:fInt},
          {key:'estoque_disponivel', label:'Estoque<br>disponível', num:true, hl:true, fmt:fInt},
          {key:'no_site', label:'No site', num:true, sort:r => r.no_site_ilimitado ? 1e9 : r.no_site, html:r => r.no_site_ilimitado ? `${n(r.no_site) ? fInt(r.no_site) + ' + ' : ''}<span class="bdg b-cinza" title="Anúncio sem controle de estoque na Nuvemshop">sem controle</span>` : (r.no_site === null || r.no_site === undefined ? '—' : `<span class="${r.risco_quebra ? 'neg-txt' : ''}">${fInt(r.no_site)}</span>`), csv:r => r.no_site_ilimitado ? 'sem controle' : r.no_site},
          {key:'consumo_medio_dia', label:'Consumo/<br>dia', num:true, fmt:v => n(v) === null ? '—' : n(v).toLocaleString('pt-BR',{maximumFractionDigits:2})},
          {key:'consumo_medio_mes', label:'Consumo/<br>mês', num:true, fmt:fInt},
          {key:'dias_estoque', label:'Dias de<br>estoque', num:true, html:r => { const d = n(r.dias_estoque); return d === null ? '—' : `<span class="${d < 15 ? 'neg-txt' : ''}">${fInt(d)}</span>`; }, csv:r => r.dias_estoque},
          {key:'classificacao', label:'Margem<br>de produto', html:r => badgeClasse(r.classificacao)},
          {key:'mc_pct', label:'MC de<br>produto %', num:true, html:r => `<span class="${n(r.mc_pct)<0?'neg-txt':''}">${fPct(r.mc_pct)}</span>`, csv:r => r.mc_pct},
          {key:'dias_fora_estoque', label:'Fora há', num:true, html:r => n(r.dias_fora_estoque) === null ? '—' : `<span class="${r.status==='Ativo'?'neg-txt':''}">${fInt(r.dias_fora_estoque)} dias</span><div class="cell-nm">desde ${fDate(r.fora_desde)}</div>`, csv:r => r.dias_fora_estoque},
          {key:'ultima_entrada', label:'Última<br>entrada', fmt:fDate},
        ]
      });
      ct.insertAdjacentHTML('beforeend', `<div class="foot-note" style="margin-top:14px">Estoque fulfillment = saldo do WMS hoje. Disponível = fulfillment − em expedição − reserva de emergência (10% do saldo, mínimo 5 unidades). Nível pelo disponível e pela curva (régua acima); fora de estoque = disponível zerado. No site = unidades cadastradas na Nuvemshop hoje, somando todos os anúncios do SKU (visíveis, não listados e ocultos). Em vermelho quando há risco de quebra. Risco de quebra = o site anuncia mais unidades do que o disponível. Consumo médio/dia = saídas da janela ÷ dias com estoque (mínimo 7); dias de estoque = disponível ÷ consumo/dia. Curva ABC = últimos 12 meses (Tiny), só produtos ativos. Margem = margem de contribuição de produto do SKU nas vendas da janela de consumo. Use "Colunas" para ocultar ou mostrar colunas (a escolha fica salva neste navegador).</div>`);
      if (matrizSel) { tabela.setFilter('curva', [matrizSel[0]]); tabela.setFilter('nivel', [matrizSel[1]]); }
    });

    block(ck, rpc('estoque_kits_painel', {}), kits => {
      ck.innerHTML = `<div class="card-head"><div><h3>Kits e <em>caixas misteriosas</em></h3><div class="hint">kits já vendidos (somente leitura) · quanto está anunciado no site hoje e quantos kits os itens em estoque permitem montar</div></div></div>`;
      makeTable(ck, {
        rows: kits.map(k => ({...k, _folga: n(k.poderia_vender) - n(k.no_site)})), exportName:'kits', search:['kit_sku','nome','item_limitante'], sort:{key:'no_site', dir:'desc'},
        rowClass: r => n(r.poderia_vender) < n(r.no_site) ? 'neg' : '',
        columns:[
          {key:'nome', label:'Kit', w:'wide', html:r => `<div style="font-size:13px">${esc(r.nome)}</div><div class="cell-nm">${esc(r.kit_sku)} · ${r.itens} itens${r.publicado ? '' : ' · oculto'}</div>`, csv:r => r.nome},
          {key:'no_site', label:'No site<br>hoje', num:true, fmt:fInt},
          {key:'poderia_vender', label:'Itens permitem<br>montar', num:true, html:r => `<span class="${n(r.poderia_vender) < n(r.no_site) ? 'neg-txt' : ''}">${fInt(r.poderia_vender)}</span>`, csv:r => r.poderia_vender},
          {key:'item_limitante', label:'Item que limita', w:'mid', html:r => `<span class="cell-nm">${esc(r.item_limitante || '—')}</span>`},
        ]
      });
      ck.insertAdjacentHTML('beforeend', `<div class="foot-note" style="margin-top:14px">Linha destacada = o site anuncia mais kits do que os itens disponíveis permitem montar. "Item que limita" é o componente com menos unidades disponíveis para o kit.</div>`);
    });
  }
}

/* ================= VIEW: CURVA ABC ================= */
function viewABC(v, f) {

  seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.nivel = b.dataset.n; renderView(); } });
  f.appendChild(seg);
  f.appendChild(chipsMulti('Canal', CANAIS, S.canais, x => { S.canais = x; renderView(); }));
  const p = rpc('produto_performance', {data_inicio:S.ini, data_fim:S.fim, p_canais:arr(S.canais), p_areas:null, p_nivel:S.nivel, p_somente_ativos:true});
  p.finally(carimbo);
  const kp = div(v), cc = div(v, 'card'), ct = div(v, 'card');
  cc.style.marginBottom = '18px';
  block(kp, p, rows => {
    rows = rows.filter(r => n(r.vendas_liquidas) > 0);

      return `<div class="card stat">${badgeCurva(c)}<div class="val" style="margin-top:10px">${fInt(r.length)} <span style="font-size:15px;font-weight:normal;color:var(--text-soft)">${S.nivel==='sku'?'SKUs':'produtos'} · ${fPct(tot ? 100*r.length/tot : null)}</span></div>
        <div class="sub">${fPct(sum(r,'participacao_pct'))} do faturamento · ${fBRLk(sum(r,'vendas_liquidas'))}</div></div>`; }).join('')}</div>`;
  });
  block(cc, p, rows => {
    rows = rows.filter(r => n(r.vendas_liquidas) > 0);
    cc.innerHTML = `<h3>Curva de <em>concentração</em></h3><div class="hint">participação acumulada no faturamento, do item que mais vende ao que menos vende · cortes em 80% (A) e 95% (B)</div>`;
    const cor = c => c === 'A' ? COR.marrom : c === 'B' ? COR.bege : COR.azul;
    mkChart(cc, {type:'line', data:{labels:rows.map((r,i)=>i+1), datasets:[{data:rows.map(r=>n(r.participacao_acum_pct)), borderColor:COR.marrom, borderWidth:2, tension:0.2, fill:false,
        pointRadius:rows.length > 80 ? 0 : 3, pointHoverRadius:6, pointBackgroundColor:rows.map(r=>cor(r.curva)), pointBorderColor:'#FFFFFF', pointBorderWidth:1.5,
        segment:{borderColor:ctx => cor(rows[ctx.p1DataIndex].curva)}}]},
      options:{maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
        scales:{x:{grid:{display:false}, border:{display:false}, title:{display:true, text:'Itens em ordem de faturamento'}, ticks:{maxTicksLimit:12}},
                y:{min:0, max:100, grid:gridY, border:{display:false}, ticks:{callback:v=>v+'%'}}},
        plugins:{refLines:{lines:[{value:80,label:'80% · fim da curva A',color:COR.laranja},{value:95,label:'95% · fim da curva B',color:COR.laranja}]},
          tooltip:{callbacks:{title:it => { const r = rows[it[0].dataIndex]; return `#${it[0].dataIndex+1} · ${r.item}`; },
            label:it => { const r = rows[it.dataIndex]; return [(r.nome||'').slice(0,50), `Faturamento ${fBRL(r.vendas_liquidas)} (${fPct(r.participacao_pct,2)})`, `Acumulado ${fPct(r.participacao_acum_pct)} · Curva ${r.curva}`]; }}}}}}, 'tall');
    cc.insertAdjacentHTML('beforeend', legendHTML([['Curva A',COR.marrom],['Curva B',COR.bege],['Curva C',COR.azul]]));
  });
  block(ct, p, rows => {
    ct.innerHTML = `<h3>Itens da <em>curva</em></h3><div class="hint">${S.nivel==='sku'?'um SKU por linha':'SKUs somados pelo nome geral do produto'}</div>`;
    makeTable(ct, {rows, exportName:'curva_abc_'+S.nivel, search:['item','nome','nome_geral'], sort:{key:'vendas_liquidas', dir:'desc'},
      pills:[{key:'curva', options:['A','B','C'], all:'Todas'}], selects:[{key:'categoria',label:'Categoria'},{key:'area_origem',label:'Área'}],
      columns:[
        {key:'rank_faturamento', label:'#', num:true, fmt:fInt},
        {key:'item', label:S.nivel==='sku'?'SKU':'Produto', w:'wide', html:r => S.nivel==='sku' ? `<div class="cell-sku">${esc(r.item)}</div><div class="cell-nm">${esc(r.nome)}</div>` : `<div style="font-size:13px">${esc(r.item)}</div><div class="cell-nm">${r.n_skus} SKU${r.n_skus>1?'s':''}</div>`, csv:r => r.item},
        {key:'categoria', label:'Categoria'}, {key:'area_origem', label:'Área'},
        {key:'curva', label:'Curva', html:r => badgeCurva(r.curva)},
        {key:'unidades', label:'Unid.', num:true, fmt:fInt},
        {key:'vendas_liquidas', label:'Faturamento', num:true, fmt:fBRL},
        {key:'participacao_pct', label:'Part. %', num:true, fmt:v => fPct(v,2)},
        {key:'participacao_acum_pct', label:'Acum. %', num:true, fmt:v => fPct(v)},
        {key:'mc_pct', label:'MC de<br>produto %', num:true, fmt:v => fPct(v)},
        {key:'classificacao', label:'Classificação', html:r => badgeClasse(r.classificacao)},
      ]});
    ct.insertAdjacentHTML('beforeend', `<div class="foot-note" style="margin-top:14px">Só produtos com status Ativo no cadastro (coleções anteriores e itens que não serão reimpressos ficam fora). Curva ABC do período filtrado: A = itens que somam até 80% do faturamento, B = até 95%, C = restante. Na tela de Estoque a curva usa os últimos 12 meses, também só com ativos.</div>`);
  });
}

function serieChart(host, serie, grupos, cores, metrica) {
  const periodos = [...new Set(serie.map(r => r.periodo))].sort();
  const idx = {}; serie.forEach(r => idx[r.periodo+'|'+r.grupo] = r);

/* ================= SIMULAÇÃO DE CAIXAS ================= */
function simulacoes(host) {
  const tk = renderToken;
  host.innerHTML = `<div class="card-head"><div><h3>Simular <em>nova caixa</em></h3><div class="hint">teste se os itens em estoque montam a próxima caixa ou kit · as simulações ficam salvas para todo o time · kits reais (acima) não são editáveis</div></div><button class="btn sm" data-novo>+ Nova simulação</button></div><div data-editor></div><div data-lista><div class="sk"></div></div>`;
  const ed = host.querySelector('[data-editor]'), lista = host.querySelector('[data-lista]');
  let base = [], mapa = new Map(), sims = [];
  const calc = s => {
    const itens = (s.itens || []).filter(i => i.sku).map(i => { const b = mapa.get(i.sku) || {}; const q = Math.max(1, +i.qtd || 1);
      const disp = n(b.disponivel) || 0, nec = q * (+s.quantidade || 0);
      return {...i, qtd:q, nome:b.nome || i.sku, disp, nec, falta: Math.max(0, nec - disp), possiveis: Math.floor(disp / q), custo: n(b.custo) || 0, sub: (n(b.custo) || 0) * q, semCusto: !(n(b.custo) > 0), img: b.imagem_url}; });
    const lim = itens.length ? itens.reduce((a, b) => b.possiveis < a.possiveis ? b : a) : null;
    const custo = itens.reduce((t, i) => t + i.sub, 0), preco = n(s.preco_venda);
    return {itens, lim, possiveis: lim ? lim.possiveis : 0, custo, custoTotal: custo * (+s.quantidade || 0), preco,
      margem: preco > 0 ? 100 * (preco - custo) / preco : null, ok: itens.length > 0 && itens.every(i => i.falta === 0), semCusto: itens.some(i => i.semCusto)};
  };
  const okBadge = c => !c.itens.length ? '<span class="bdg b-cinza">sem itens</span>' : c.ok ? `<span class="bdg b-heroi">${svg(ICON.up)}dá para montar</span>` : `<span class="bdg b-ofensor">${svg(ICON.down)}falta estoque</span>`;

  function desenharLista() {
    if (!sims.length) { lista.innerHTML = '<div class="empty">Nenhuma caixa simulada ainda. Clique em "+ Nova simulação" para testar uma.</div>'; return; }
    lista.innerHTML = '';
    makeTable(lista, {
      rows: sims.map(s => { const c = calc(s); return {...s, _c:c, _itens:c.itens.length, _poss:c.possiveis, _custo:c.custo, _margem:c.margem, _lim:c.lim ? c.lim.nome : null}; }),
      exportName:'caixas_simuladas', search:['nome','criado_por'], sort:{key:'criado_em', dir:'desc'},
      rowClass: r => r._c.ok ? '' : 'neg',
      columns:[
        {key:'nome', label:'Caixa simulada', w:'wide', html:r => `<div style="font-size:13px">${esc(r.nome)}</div><div class="cell-nm">${r._itens} itens · ${esc(r.criado_por || '')}${r.criado_em ? ' · ' + fDate(String(r.criado_em).slice(0,10)) : ''}</div>`, csv:r => r.nome},
        {key:'quantidade', label:'Caixas<br>planejadas', num:true, fmt:fInt},
        {key:'_poss', label:'Estoque<br>permite', num:true, html:r => `<span class="${r._poss < r.quantidade ? 'neg-txt' : ''}">${fInt(r._poss)}</span>`, csv:r => r._poss},
        {key:'_lim', label:'Item que limita', w:'mid', html:r => `<span class="cell-nm">${esc(r._lim || '—')}</span>`},
        {key:'_custo', label:'Custo<br>por caixa', num:true, fmt:fBRL},
        {key:'preco_venda', label:'Preço<br>sugerido', num:true, fmt:fBRL},
        {key:'_margem', label:'Margem<br>bruta %', num:true, html:r => `<span class="${n(r._margem) < 0 ? 'neg-txt' : ''}">${fPct(r._margem)}</span>`, csv:r => r._margem},
        {key:'criado_em', label:'Situação', html:r => okBadge(r._c), csv:r => r._c.ok ? 'dá para montar' : 'falta estoque'},
        {key:'id', label:'', noCsv:true, html:r => `<button class="btn sec sm" data-edit="${r.id}">Editar</button>`},
      ]
    });
    lista.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => abrir(sims.find(s => s.id === b.dataset.edit))));
  }

  function abrir(sim) {
    const s = sim ? JSON.parse(JSON.stringify(sim)) : {nome:'', quantidade:100, preco_venda:null, itens:[{sku:'', qtd:1}]};
    const opts = base.map(b => `<option value="${esc(b.sku)}">${esc(b.nome)} · ${fInt(b.disponivel)} disp.</option>`).join('');
    ed.innerHTML = `<div class="sim-ed">
      <div class="sim-row">
        <label class="field" style="flex:2;min-width:220px"><span>Nome da caixa</span><input class="input" data-f="nome" value="${esc(s.nome)}" placeholder="Ex.: Caixa Misteriosa de Natal"></label>
        <label class="field" style="width:160px"><span>Quantidade de caixas</span><input class="input" type="number" min="0" step="1" data-f="quantidade" value="${s.quantidade ?? ''}"></label>
        <label class="field" style="width:180px"><span>Preço de venda sugerido</span><input class="input" type="number" min="0" step="0.01" data-f="preco_venda" value="${s.preco_venda ?? ''}" placeholder="R$"></label>
      </div>
      <datalist id="sim-skus">${opts}</datalist>
      <div class="tscroll" style="max-height:none"><table class="t"><thead><tr><th>Produto (SKU)</th><th class="num">Qtd por<br>caixa</th><th class="num">Disponível</th><th class="num">Necessário</th><th class="num">Caixas<br>possíveis</th><th class="num">Custo<br>unitário</th><th class="num">Custo na<br>caixa</th><th></th></tr></thead><tbody data-itens></tbody></table></div>
      <button class="btn sec sm" data-add style="margin-top:10px">+ Adicionar produto</button>
      <div class="sim-res" data-res></div>
      <div class="sim-acts"><button class="btn" data-salvar>Salvar simulação</button><button class="btn sec" data-cancelar>Cancelar</button>${sim ? '<button class="btn sec" data-excluir style="margin-left:auto;color:var(--erro);border-color:#F2C9BB">Excluir simulação</button>' : ''}<span class="sim-msg" data-msg></span></div>
    </div>`;
    const tb = ed.querySelector('[data-itens]'), res = ed.querySelector('[data-res]'), msg = ed.querySelector('[data-msg]');
    const atualizar = () => {
      const c = calc(s);
      tb.querySelectorAll('tr').forEach((tr, i) => {
        const it = s.itens[i];
        const b = mapa.get(it.sku), q = Math.max(1, +it.qtd || 1);
        const disp = b ? n(b.disponivel) : null, nec = q * (+s.quantidade || 0), poss = b ? Math.floor(disp / q) : null;
        const isLim = c.lim && c.lim.sku === it.sku && it.sku;
        tr.classList.toggle('neg', !!b && disp < nec);
        tr.querySelector('[data-c="disp"]').textContent = b ? fInt(disp) : '—';
        tr.querySelector('[data-c="nec"]').innerHTML = b ? (disp < nec ? `<span class="neg-txt">${fInt(nec)}</span><div class="cell-nm">faltam ${fInt(nec - disp)}</div>` : fInt(nec)) : '—';
        tr.querySelector('[data-c="poss"]').innerHTML = b ? `${fInt(poss)}${isLim ? '<div><span class="bdg b-ofensor">limita</span></div>' : ''}` : '—';
        tr.querySelector('[data-c="cu"]').innerHTML = b ? (n(b.custo) > 0 ? fBRL(b.custo) : '<span class="cell-nm">sem custo</span>') : '—';
        tr.querySelector('[data-c="sub"]').textContent = b ? fBRL((n(b.custo) || 0) * q) : '—';
        tr.querySelector('[data-c="nm"]').textContent = b ? b.nome : (it.sku ? 'SKU não encontrado' : '');
      });
      res.innerHTML = `<div class="grid g4" style="margin:16px 0 0">
        <div class="card stat small" style="box-shadow:none;border:1px solid var(--border)"><div class="lbl">Estoque permite montar</div><div class="val ${c.possiveis < (+s.quantidade || 0) ? 'neg' : ''}">${fInt(c.possiveis)} caixas</div><div class="sub">${c.lim ? 'limitado por ' + esc(c.lim.nome) : 'adicione produtos'}</div></div>
        <div class="card stat small" style="box-shadow:none;border:1px solid var(--border)"><div class="lbl">Custo por caixa</div><div class="val">${fBRL(c.custo)}</div><div class="sub">${c.semCusto ? '<span class="neg-txt">há item sem custo cadastrado</span>' : 'custo atual dos produtos'}</div></div>
        <div class="card stat small" style="box-shadow:none;border:1px solid var(--border)"><div class="lbl">Custo total</div><div class="val">${fBRLk(c.custoTotal)}</div><div class="sub">${fInt(+s.quantidade || 0)} caixas planejadas</div></div>
        <div class="card stat small" style="box-shadow:none;border:1px solid var(--border)"><div class="lbl">Margem bruta</div><div class="val ${n(c.margem) < 0 ? 'neg' : ''}">${fPct(c.margem)}</div><div class="sub">${c.preco > 0 ? fBRL(c.preco - c.custo) + ' por caixa' : 'informe o preço sugerido'}</div></div>
      </div>
      <div class="callout ${c.ok ? 'note' : 'erro'}" style="margin:14px 0 0">${!c.itens.length ? 'Adicione os produtos da caixa.' : c.ok ? `Dá para montar as ${fInt(+s.quantidade || 0)} caixas com o estoque disponível hoje.` : `Não dá para montar as ${fInt(+s.quantidade || 0)} caixas: faltam unidades de ${c.itens.filter(i => i.falta > 0).map(i => `${esc(i.nome)} (${fInt(i.falta)})`).join(', ')}.`}</div>`;
    };
    const linhas = () => {
      tb.innerHTML = s.itens.map((it, i) => `<tr data-i="${i}">
        <td class="wide"><input class="input" list="sim-skus" data-sku value="${esc(it.sku)}" placeholder="Digite o SKU ou nome" style="min-width:220px"><div class="cell-nm" data-c="nm" style="margin-top:4px"></div></td>
        <td class="num"><input class="input" type="number" min="1" step="1" data-qtd value="${it.qtd}" style="width:70px;text-align:right"></td>
        <td class="num" data-c="disp"></td><td class="num" data-c="nec"></td><td class="num" data-c="poss"></td><td class="num" data-c="cu"></td><td class="num" data-c="sub"></td>
        <td><button class="btn sec sm" data-rm title="Remover produto">✕</button></td></tr>`).join('');
      tb.querySelectorAll('tr').forEach(tr => { const i = +tr.dataset.i;
        const inp = tr.querySelector('[data-sku]');
        inp.addEventListener('change', () => { let v = inp.value.trim(); if (!mapa.has(v)) { const m = base.find(b => b.nome.toLowerCase() === v.toLowerCase()); if (m) v = m.sku; } s.itens[i].sku = v; inp.value = v; atualizar(); });
        tr.querySelector('[data-qtd]').addEventListener('input', e => { s.itens[i].qtd = Math.max(1, +e.target.value || 1); atualizar(); });
        tr.querySelector('[data-rm]').addEventListener('click', () => { s.itens.splice(i, 1); if (!s.itens.length) s.itens.push({sku:'', qtd:1}); linhas(); });
      });
      atualizar();
    };
    ed.querySelectorAll('[data-f]').forEach(inp => inp.addEventListener('input', () => { const k = inp.dataset.f; s[k] = k === 'nome' ? inp.value : (inp.value === '' ? null : +inp.value); atualizar(); }));
    ed.querySelector('[data-add]').addEventListener('click', () => { s.itens.push({sku:'', qtd:1}); linhas(); tb.querySelector('tr:last-child [data-sku]').focus(); });
    ed.querySelector('[data-cancelar]').addEventListener('click', () => { ed.innerHTML = ''; });
    ed.querySelector('[data-salvar]').addEventListener('click', async () => {
      const itens = s.itens.filter(i => i.sku).map(i => ({sku:i.sku, qtd:Math.max(1, +i.qtd || 1)}));
      if (!s.nome || !s.nome.trim()) { msg.textContent = 'Dê um nome para a caixa.'; return; }
      if (itens.some(i => !mapa.has(i.sku))) { msg.textContent = 'Há SKU que não existe no cadastro.'; return; }
      msg.textContent = 'Salvando…';
      const reg = {nome:s.nome.trim(), quantidade:Math.max(0, Math.round(+s.quantidade || 0)), preco_venda:s.preco_venda, itens, atualizado_em:new Date().toISOString()};
      const r = sim ? await sb.from('kits_simulacoes').update(reg).eq('id', sim.id) : await sb.from('kits_simulacoes').insert(reg);
      if (r.error) { msg.textContent = 'Não foi possível salvar: ' + r.error.message; return; }
      ed.innerHTML = ''; carregarSims();
    });
    const ex = ed.querySelector('[data-excluir]');
    if (ex) ex.addEventListener('click', async () => {
      if (ex.dataset.conf !== '1') { ex.dataset.conf = '1'; ex.textContent = 'Clique de novo para confirmar'; return; }
      msg.textContent = 'Excluindo…';
      const r = await sb.from('kits_simulacoes').delete().eq('id', sim.id);
      if (r.error) { msg.textContent = 'Não foi possível excluir: ' + r.error.message; return; }
      ed.innerHTML = ''; carregarSims();
    });
    linhas();
    ed.scrollIntoView({behavior:'smooth', block:'start'});
  }

  async function carregarSims() {
    const r = await sb.from('kits_simulacoes').select('*').order('criado_em', {ascending:false});
    if (tk !== renderToken) return;
    if (r.error) { lista.innerHTML = `<div class="callout alerta" style="margin:0">As simulações ainda não estão ativadas no banco (falta rodar o arquivo simulacao_caixas.sql no Supabase).<br><small>${esc(r.error.message)}</small></div>`; host.querySelector('[data-novo]').disabled = true; return; }
    sims = r.data || []; desenharLista();
  }
  rpc('kits_simulacao_base', {}).then(b => {
    if (tk !== renderToken) return;
    base = b; mapa = new Map(b.map(x => [x.sku, x]));
    host.querySelector('[data-novo]').addEventListener('click', () => abrir(null));
    carregarSims();
  }).catch(e => { if (tk !== renderToken) return; lista.innerHTML = `<div class="callout alerta" style="margin:0">As simulações ainda não estão ativadas no banco (falta rodar o arquivo simulacao_caixas.sql no Supabase).<br><small>${esc(e.message || '')}</small></div>`; host.querySelector('[data-novo]').disabled = true; });
}
